[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "german-legal-engine"
version = "1.0.0"
description = "Sovereign German Legal Research & Procedural Subsumption Engine for AI Agents (MCP Server + Python SDK)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Agentiqa & LeoLegal Core Team" }
]
keywords = [
    "legal-tech",
    "german-law",
    "mcp",
    "mcp-server",
    "bgb",
    "zpo",
    "bgh",
    "bag",
    "legal-research",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
gle = "german_legal_engine.cli:main"
german-legal-mcp = "german_legal_engine.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/german_legal_engine"]
